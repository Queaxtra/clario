<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem('clario.theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
					const locale = localStorage.getItem('clario.locale');
					if (locale && ['en', 'tr', 'de', 'fr', 'es', 'it', 'pt', 'ru'].includes(locale)) {
						document.documentElement.lang = locale;
					}
				} catch {
					// storage can be unavailable, fall back to the default light theme
				}
			})();
		</script>
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<title>Clario · Fatih Yılmaz</title>
